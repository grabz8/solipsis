<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
    <head>
        <title>uiworlds</title>
		<script type="text/javascript" src="SolipsisHelpers.js"></script>
        <script type="text/javascript" src="Navi.js"></script>
        <script type="text/javascript">
            function pageLoaded()
            {
                var localWorld = getURLParam("localWorld");
                var selectWorlds = document.getElementById("selectWorlds");
                selectWorlds.innerHTML = "";
                if (localWorld)
                    selectWorlds.innerHTML += "<option value='" + localWorld + "'>Local World</option>";
                selectWorlds.innerHTML += "<option value='127.0.0.1:8660'>Children Island</option>";
                selectWorlds.innerHTML += "<option value='127.0.0.1:8559'>Delta Station</option>";
                new NaviData('pageLoaded').add({naviName:'uiworlds'}).send();
            }
            function buttonPressed(buttonName)
            {
                var naviData = new NaviData(buttonName);
                if (buttonName == 'ok')
                    naviData.add({world:document.getElementById("selectWorlds").value});
                naviData.send();
            }
        </script>
        <style type="text/css">
            body
            {
                padding-left: 11em;
	            background-color: #000000;
	            overflow: hidden;
	            font-family: Verdana;
	            font-size: small;
	            color: #FFFFFF;
            }
            li { color: Black; }
            #container
            {
	            background-image: url('uiworlds.png');
	            position: absolute;
	            left: 0px;
	            top: 0px;
	            width: 256px;
	            height: 256px;
            }
            #worldsSelect
            {
	            position: absolute;
	            left: 8px;
	            top: 60px;
            }
            .button
            {
	            position: absolute;
	            top: 215px;
	            width: 110px;
	            height: 30px;
            }
            #okButton { left: 10px; z-index: 0;}
            #cancelButton { left: 130px; z-index: 0;}
        </style>
    </head>

    <body onload="pageLoaded()">
        <div id="container">
            <div id="worldsSelect">
                <select id="selectWorlds" name="selectWorlds" size="9" style="width:240px" ondblclick="buttonPressed('ok')">
                </select>
            </div>
            <div id="okButton" class="button" onclick="buttonPressed('ok')"></div>
            <div id="cancelButton" class="button" onclick="buttonPressed('cancel')"></div>
        </div>
    </body>
</html>
