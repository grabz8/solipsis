<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
	<head>
		<title>uiavatarmain</title>
		<script type="text/javascript" src="Navi.js"></script>
		<script type="text/javascript">
            function pageLoaded()
            {
                new NaviData('pageLoaded').add({naviName:'uiavatarmain'}).send();
            }
            function elementClicked(elementName)
            {
                new NaviData(elementName).send();
            }
		</script>
		<style type="text/css"> 
			body { 
				padding-left: 11em; 
				background-color: #000000; 
				overflow: hidden; 
				font-family: Verdana; 
				font-size: small; 
				color: #FFFFFF; 
			}
			#container { 
				background-image: url('uiavatarmain.png'); 
				position: absolute; 
				left: 0px; top: 0px; 
				width: 256px; 
				height: 512px; 
			}
			#containerMenu { 
				position: absolute; 
				left: 8px; 
				top: 20px; 
				width: 240px; 
				height: 472px; 
			}
			p {
				color:#000000;
			}
			input { 
				width: 100px; 
			}
		</style>
	</head>
	<body onload="pageLoaded()">
		<div id="container">
            <div id="containerMenu">
			<table align="center" width="220">

				<tr>
					<td align="center">
						<br>
						<div id="AvatarName">
						    <p>Name : <b>???</b></p>
						</div>
						<br>
					</td>
				</tr>

				<tr>
				    <td align="center">
				        <div style='height: 128px; width: 128px; overflow: auto' id="AvatarThumbnail"></div>
				    </td>
				</tr>

				<tr >
					<td align="center">
						<input type="button" value=" < " style='width: 32px' onclick="elementClicked('AvatarPrev')">
						<input type="button" value=" > " style='width: 32px' onclick="elementClicked('AvatarNext')">
					</td>		    
				</tr>

				<tr>
				    <td align="center">
				        <br><br>
						<input type="button" value="Open" size="10" onclick="elementClicked('FileOpen')"><br>
						<input type="button" value="Edit" size="10" onclick="elementClicked('AvatarEdit')"><br>
						<input type="button" value="Save" size="10" onclick="elementClicked('FileSave')"><br>
						<input type="button" value="Save as" size="10" onclick="elementClicked('FileSaveAs')"><br>
						<input type="button" value="Exit" size="10" onclick="elementClicked('FileExit')"><br>
					</td>
				</tr>
				
			</table>
            </div>
        </div>
	</body>
</html>
