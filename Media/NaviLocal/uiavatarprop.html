            function pageLoaded()
            {	
				/* TABBERS */
                tabberAutomatic(); 
                
               	/* COLOR */
				loadSV();
				$S('plugin').display='none';
				$S('SVslide').top=(80/100*170-7)+'px';
	
				new NaviData('pageLoaded').add({naviName:'uiavatarprop'}).send();
			}
            
            function elementClicked(elementName)
            {
                new NaviData(elementName).send();
            }
            
            function sendMessage(message)
            {
				//alert(message);
				new NaviData('sendMessage').add({msg:message}).send();
            }  
        </script>

	<body onload="pageLoaded()">

						<h2>Animations</h2>
						<p><table align="center">
						    <tr>
								<td align="center">
								    <input type="button" value="Open edition panel" size="20" onclick=""/>
								</td>
							</tr>
							<tr>
								<td align="center">

								</td>
							</tr>
							
							
					    </table></p>

					<!-- PROPERTIES -->

								<td>Shininess</td>

								</td>
							</tr>
							<tr>
								<td>Diffuse</td>

									<div id="pDiffuse" style="HEIGHT: 20px; WIDTH: 64px; COLOR: #FF0; BORDER: 2px solid #ACA;"
										onclick="{panel='pDiffuse'; initColor();}"></div>
								</td>
								<td>Transparency</td>
								<td>
									<div class="slider" id="transparency">
										<input class="slider-input" id="transparencyInput" />
									</div>
								</td>
							</tr>
							<tr>
								<td>Specular</td>
								<td>
									<div id="pSpecular" style="HEIGHT: 20px; WIDTH: 64px; COLOR: #FF0; BORDER: 2px solid #ACA;"
										onclick="{panel='pSpecular'; initColor();}"></div>

							</tr>
							<tr>
								<td></td>

								<td>
									<div class="slider" id="scaleU">
										<input class="slider-input" id="scaleUInput" />
									</div>
								</td>
							</tr>
							<tr>
								<td></td>
								<td></td>
								<td>Scale V</td>
								<td>
									<div class="slider" id="scaleV">
										<input class="slider-input" id="scaleVInput" />
									</div>
								</td>
							</tr>
							<tr>
								<td></td>

									<input type="button" value="Apply" onclick="elementClicked('MdlrApplyTexture')">

							</tr>

											</td>
										</tr>
									</table>

							</tr>

								<td><b>INACTIVE</b></td>
							</tr>
						</table></p>

				<!-- SLIDERS BEGIN -->
				<script type="text/javascript">
					var currentTexture = -1;
					var textTabTextures = "";
					var update = false;
		
					// definition for the material
					var shininess = new Slider(document.getElementById("shininess"), document.getElementById("shininessInput"));
					var transparency = new Slider(document.getElementById("transparency"), document.getElementById("transparencyInput"));
					var scrollU = new Slider(document.getElementById("scrollU"), document.getElementById("scrollUInput"));
					var scrollV = new Slider(document.getElementById("scrollV"), document.getElementById("scrollVInput"));
					var scaleU = new Slider(document.getElementById("scaleU"), document.getElementById("scaleUInput"));
					var scaleV = new Slider(document.getElementById("scaleV"), document.getElementById("scaleVInput"));
					var rotateU = new Slider(document.getElementById("rotateU"), document.getElementById("rotateUInput"));
					
					// set min & max values
					revolution.setMinimum(1); revolution.setMaximum(5);
					
					// onchange / deformations				
					taperX.onchange = function() {elementClicked('MdlrTaperX')};
					taperY.onchange = function() {elementClicked('MdlrTaperY')};
					topShearX.onchange = function() {elementClicked('MdlrTopShearX')};
					topShearY.onchange = function() {elementClicked('MdlrTopShearY')};
					twistBegin.onchange = function() {elementClicked('MdlrTwistBegin')};
					twistEnd.onchange = function() {elementClicked('MdlrTwistEnd')};
					dimpleBegin.onchange = function() {elementClicked('MdlrDimpleBegin')};
					dimpleEnd.onchange = function() {elementClicked('MdlrDimpleEnd')};
					pathCutBegin.onchange = function() {elementClicked('MdlrPathBegin')};
					pathCutEnd.onchange = function() {elementClicked('MdlrPathEnd')};
					holeSizeX.onchange = function() {elementClicked('MdlrHoleX')};
					holeSizeY.onchange = function() {elementClicked('MdlrHoleY')};
					skew.onchange = function() {elementClicked('MdlrSkew')};
					revolution.onchange = function() {elementClicked('MdlrRevolution')};
					radiusDelta.onchange = function() {elementClicked('MdlrRadiusDelta')};
            
function updTexture()
{
	document.getElementById('divTexture').innerHTML=textTabTextures;
}

function updateTexture()
{
	updTexture();
}
