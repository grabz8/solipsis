<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
    <head>
        <title>uichat</title>
        <script type="text/javascript" src="Navi.js"></script>
        <script type="text/javascript">
            function pageLoaded()
            {
                new NaviData('pageLoaded').send();
                // AUTOMATIC TEST TO SPEED UP UNITARY TESTS
                new NaviData('debugCommand').add({cmd:'testEvt'}).add({params:'peerNew'}).send();
                new NaviData('debugCommand').add({cmd:'demoNavi2'}).add({params:'http://fr.youtube.com/watch?v=u5WIEep8DJg'}).send();
            }
            function sendMessage(message)
            {
                new NaviData('sendMessage').add({msg:message}).send();
            }
        </script>
        <style type="text/css">
            body
            {
                padding-left: 11em;
	            background-color: #000000;
	            overflow: hidden;
	            font-family: Verdana;
	            font-size: small;
	            color: #FFFFFF;
            }
            #container
            {
	            background-image: url('uichat.png');
	            position: absolute;
	            left: 0px;
	            top: 0px;
	            width: 512px;
	            height: 64px;
            }
            #chatInput
            {
	            position: absolute;
	            left: 65px;
	            top: 5px;
            }
            .inputText
            {
                background-color: #FFFFFF;
                color: #000000;
            }
        </style>
    </head>

    <body onload="pageLoaded()">
        <div id="container">
            <!--
            Here you will use 1 reentrant hidden form in order to validate the message by pressing ENTER,
            by returning false the page won t be reloaded
             -->
            <form id="chatForm" action="" visible="false" onsubmit="sendMessage(document.getElementById('inputChat').value);return false;">
                <div id="chatInput">
                    <input id="inputChat" class="inputText" name="inputChat" value="" type="text" size="65" />
                </div>
            </form>
        </div>
    </body>
</html>
