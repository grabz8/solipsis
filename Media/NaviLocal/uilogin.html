<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

    <head>
        <title>uilogin</title>
        <script type="text/javascript" src="Navi.js"></script>
        <!-- SELECTOR BEGIN -->
        <link rel="stylesheet" href="selector/selector.css" type="text/css">
        <script type="text/javascript" src="selector/selector.js"></script>

        <script type="text/javascript">
            function pageLoaded()
            { 
                new NaviData('pageLoaded').send();
                // AUTOMATIC LOGIN TO SPEED UP UNITARY TESTS
                //buttonPressed('connect')
            }
            function buttonPressed(buttonName)
            {
                var naviData = new NaviData(buttonName);
                if (buttonName == 'connect')
                    naviData.add({login:document.getElementById("inputLogin").value});
                naviData.send();
            }
            function select(value)
            {
                $('avatarSelectItem').style.display='none';
                $('avatarSelectTitre').innerHTML = ""+value;
                new NaviData('selectAvatar').add({item:value}).send();
            }
        </script>
        
        <style type="text/css">
            body
            {
                padding-left: 11em;
	            background-color: #000000;
	            overflow: hidden;
	            font-family: Verdana;
	            font-size: small;
	            color: #FFFFFF;
            }
            li { color: Black; }
            #container
            {
	            background-image: url('uilogin.png');
	            position: absolute;
	            left: 0px;

            }
            .inputText

                background-color: #FFFFFF;

            #avatarText

            #connectButton { left: 20px; z-index: 0;}
            #optionsButton { left: 144px; z-index: 0;}
            #quitButton { left: 270px; z-index: 0;}
            #infosText

	            font-style: italic;
	            font-weight: bold;
	            text-align: left;
	            color: #FFFF33;
            }
        </style>
    </head>

    <body onload="pageLoaded()">
        <div id="container">
            <div id="loginText">Login</div>
            <form id="loginForm" action="" onsubmit="buttonPressed('connect');return false;">
                <div id="loginInput">
                    <input id="inputLogin" class="inputText" name="inputLogin" value="me" type="text" size="35" />
                </div>
            </form>
            <div id="infosText"></div>
            <div id="connectButton" class="button" onclick="buttonPressed('connect')"></div>
            <div id="optionsButton" class="button" onclick="buttonPressed('options')"></div>
            <div id="quitButton" class="button" onclick="buttonPressed('quit')"></div>
            
            <div id="avatarText" style="display:none">Avatar</div>
