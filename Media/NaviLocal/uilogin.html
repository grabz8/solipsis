<html>
    <head>
        <script type="text/javascript" src="mootools.v1.1.js"></script>
        <script type="text/javascript" src="Navi.js"></script>
        <script type="text/javascript">
            function pageLoaded()
            {
                new NaviData('pageRefresh').send();
                // AUTOMATIC LOGIN TO SPEED UP UNITARY TESTS
                //document.getElementById("inputLogin").value = 'uilogin.html';
                //buttonPressed('connect')
            }
            function buttonPressed(buttonName)
            {
                var naviData = new NaviData(buttonName);
                if (buttonName == 'connect')
                    naviData.add('login', document.getElementById("inputLogin").value);
                naviData.send();
            }
        </script>
        <style type="text/css">
            body
            {
                padding-left: 11em;
	            background-color: #000000;
	            overflow: hidden;
	            font-family: Verdana;
	            font-size: small;
	            color: #FFFFFF;
            }
            #container
            {
	            background-image: url('uilogin.png');
	            position: absolute;
	            left: 0px;
	            top: 0px;
	            width: 400px;
	            height: 300px;
            }
            #loginText
            {
	            position: absolute;
	            left: 50px;
	            top: 125px;
            }
            #loginInput
            {
	            position: absolute;
	            left: 110px;
	            top: 125px;
            }
            .inputText
            {
                background-color: #FFFFFF;
                color: #000000;
            }
            #infosText
            {
	            position: absolute;
	            left: 20px;
	            top: 160px;
	            width: 300px;
	            height: 30px;
	            font-size: 14px;
	            font-style: italic;
	            font-weight: bold;
	            text-align: left;
	            color: #FFFF33;
            }
            .button
            {
	            position: absolute;
	            top: 240px;
	            width: 110px;
	            height: 40px;
            }
            #connectButton { left: 20px; }
            #optionsButton { left: 144px; }
            #quitButton { left: 270px; }
        </style>
    </head>

    <body onload="pageLoaded()">
        <div id="container">
            <div id="loginText">Login</div>
            <div id="loginInput">
                <input id="inputLogin" class="inputText" name="inputLogin" value="me" type="text" size="35" />
            </div>
            <div id="infosText"></div>
            <div id="connectButton" class="button" onclick="buttonPressed('connect')"></div>
            <div id="optionsButton" class="button" onclick="buttonPressed('options')"></div>
            <div id="quitButton" class="button" onclick="buttonPressed('quit')"></div>
        </div>
    </body>
</html>
